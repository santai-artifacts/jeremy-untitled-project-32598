<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #131a2a;
    --panel-2: #1a2236;
    --grid-a: #0f1524;
    --grid-b: #121a2c;
    --snake: #4ade80;
    --snake-head: #86efac;
    --food: #fb7185;
    --food-glow: #f43f5e;
    --text: #e5e9f0;
    --muted: #8b95a7;
    --accent: #60a5fa;
    --border: #232c40;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #16233f 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #1a1330 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }

  .title {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 40px; height: 40px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--snake), #22c55e);
    display: grid;
    place-items: center;
    box-shadow: 0 6px 20px -6px rgba(74,222,128,.6);
    flex-shrink: 0;
  }
  .logo svg { width: 22px; height: 22px; display: block; }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--muted); font-weight: 500; }

  .scores {
    display: flex;
    gap: 10px;
  }
  .score-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 14px;
    min-width: 74px;
    text-align: right;
  }
  .score-card .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 600;
  }
  .score-card .value {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .score-card.best .value { color: var(--accent); }

  .board-wrap {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,.7);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    touch-action: none;
    background: var(--grid-a);
  }

  /* Overlay */
  .overlay {
    position: absolute;
    inset: 14px;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(11,15,26,.72), rgba(11,15,26,.9));
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
    padding: 24px;
    transition: opacity .25s ease, visibility .25s ease;
  }
  .overlay.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .overlay h2 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .overlay p {
    color: var(--muted);
    max-width: 300px;
    line-height: 1.5;
    font-size: 14px;
  }
  .overlay .final {
    color: var(--text);
    font-size: 15px;
  }
  .overlay .final b { color: var(--snake); }

  .btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #06210f;
    background: linear-gradient(135deg, var(--snake-head), var(--snake));
    border: none;
    border-radius: 11px;
    padding: 12px 26px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .2s ease;
    box-shadow: 0 8px 24px -8px rgba(74,222,128,.7);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74,222,128,.85); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid var(--snake-head); outline-offset: 3px; }

  .keyhint {
    display: flex;
    gap: 6px;
    align-items: center;
    color: var(--muted);
    font-size: 12px;
  }
  kbd {
    font-family: inherit;
    font-size: 11px;
    background: var(--panel-2, #1a2236);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 3px 7px;
    color: var(--text);
    min-width: 22px;
    text-align: center;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12.5px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .controls-row { display: flex; gap: 6px; align-items: center; }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    color: var(--muted);
  }
  .pill b { color: var(--text); font-weight: 600; }

  .pause-btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .pause-btn:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 480px) {
    body { padding: 14px; }
    h1 { font-size: 22px; }
    .overlay h2 { font-size: 25px; }
    .score-card { min-width: 62px; padding: 7px 11px; }
    .score-card .value { font-size: 19px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#06210f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h9a3 3 0 0 1 0 6H8a3 3 0 0 0 0 6h9" />
            <circle cx="18" cy="6" r="1.4" fill="#06210f" stroke="none" />
          </svg>
        </div>
        <h1>Snake <span>· classic</span></h1>
      </div>
      <div class="scores">
        <div class="score-card">
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-card best">
          <div class="label">Best</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="game" width="480" height="480" aria-label="Snake game board" role="img"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Snake</h2>
        <p id="ov-text">Eat the food, grow long, and don't bite yourself or hit the walls.</p>
        <p class="final" id="ov-final" hidden></p>
        <button class="btn" id="startBtn">Play</button>
        <div class="keyhint">
          <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
          <span>or</span>
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          <span>· swipe on mobile</span>
        </div>
      </div>
    </div>

    <footer>
      <div class="controls-row">
        <span class="pill"><b>Space</b> pause</span>
        <span class="pill"><b>R</b> restart</span>
      </div>
      <button class="pause-btn" id="pauseBtn" aria-label="Pause game">Pause</button>
    </footer>
  </div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const ovFinal = document.getElementById('ov-final');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  // --- Config ---
  const GRID = 20;                 // cells per side
  const CELL = canvas.width / GRID; // pixel size of a cell
  const START_LEN = 4;
  const BASE_SPEED = 8;            // moves per second at start
  const MAX_SPEED = 18;
  const SPEED_STEP = 0.35;         // speed gained per food

  // --- State ---
  let snake, dir, nextDir, food, score, best, speed;
  let state = 'idle'; // idle | running | paused | over
  let acc = 0, last = 0, rafId = null;
  let popT = 0; // food-eaten pop animation timer

  best = loadBest();
  bestEl.textContent = best;

  function loadBest() {
    try {
      const v = parseInt(localStorage.getItem('snake_best') || '0', 10);
      return Number.isFinite(v) ? v : 0;
    } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('snake_best', String(v)); } catch {}
  }

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [];
    for (let i = 0; i < START_LEN; i++) snake.push({ x: mid - i, y: mid });
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = BASE_SPEED;
    scoreEl.textContent = '0';
    placeFood();
    popT = 0;
  }

  function placeFood() {
    const free = [];
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        const k = x + ',' + y;
        if (!occupied.has(k)) free.push({ x, y });
      }
    }
    if (free.length === 0) { win(); return; }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function startGame() {
    reset();
    state = 'running';
    hideOverlay();
    last = performance.now();
    acc = 0;
    if (!rafId) rafId = requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'over';
    if (score > best) { best = score; bestEl.textContent = best; saveBest(best); }
    ovTitle.textContent = 'Game Over';
    ovText.textContent = 'You tangled up. Give it another go.';
    ovFinal.hidden = false;
    ovFinal.innerHTML = `Score <b>${score}</b> &nbsp;·&nbsp; Best <b>${best}</b>`;
    startBtn.textContent = 'Play again';
    showOverlay();
  }

  function win() {
    state = 'over';
    if (score > best) { best = score; bestEl.textContent = best; saveBest(best); }
    ovTitle.textContent = 'You filled the board!';
    ovText.textContent = 'A perfect game. Legendary.';
    ovFinal.hidden = false;
    ovFinal.innerHTML = `Score <b>${score}</b> &nbsp;·&nbsp; Best <b>${best}</b>`;
    startBtn.textContent = 'Play again';
    showOverlay();
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      ovTitle.textContent = 'Paused';
      ovText.textContent = 'Take a breath. Resume when ready.';
      ovFinal.hidden = true;
      startBtn.textContent = 'Resume';
      showOverlay();
    } else if (state === 'paused') {
      state = 'running';
      hideOverlay();
      last = performance.now();
    }
  }

  function showOverlay() { overlay.classList.remove('hidden'); }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function setDir(nx, ny) {
    // prevent 180° reversal relative to the last committed direction
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  function step() {
    dir = nextDir;
    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    // wall collision
    if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) { gameOver(); return; }

    // self collision (allow moving into the current tail cell, which will move away —
    // but only if we're not growing this tick)
    const eating = food && nx === food.x && ny === food.y;
    const bodyLimit = eating ? snake.length : snake.length - 1;
    for (let i = 0; i < bodyLimit; i++) {
      if (snake[i].x === nx && snake[i].y === ny) { gameOver(); return; }
    }

    snake.unshift({ x: nx, y: ny });

    if (eating) {
      score++;
      scoreEl.textContent = score;
      speed = Math.min(MAX_SPEED, speed + SPEED_STEP);
      popT = 1;
      placeFood();
    } else {
      snake.pop();
    }
  }

  // --- Rendering ---
  function drawGrid() {
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#0f1524' : '#121a2c';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawFood() {
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const pulse = 1 + 0.08 * Math.sin(performance.now() / 200);
    const r = (CELL * 0.32) * pulse;

    ctx.save();
    ctx.shadowColor = 'rgba(244,63,94,.8)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#fb7185';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // little leaf
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.ellipse(cx + r * 0.5, cy - r * 0.8, r * 0.35, r * 0.18, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake() {
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const seg = snake[i];
      const t = n <= 1 ? 1 : 1 - i / n; // 1 at head → smaller toward tail
      const pad = CELL * (0.12 + 0.06 * (1 - t));
      const x = seg.x * CELL + pad;
      const y = seg.y * CELL + pad;
      const size = CELL - pad * 2;

      if (i === 0) {
        // head
        ctx.save();
        ctx.shadowColor = 'rgba(74,222,128,.55)';
        ctx.shadowBlur = 14;
        const g = ctx.createLinearGradient(x, y, x + size, y + size);
        g.addColorStop(0, '#86efac');
        g.addColorStop(1, '#4ade80');
        ctx.fillStyle = g;
        roundRect(x, y, size, size, CELL * 0.34);
        ctx.fill();
        ctx.restore();
        drawEyes(seg);
      } else {
        const light = 0.55 + 0.45 * t;
        ctx.fillStyle = mix('#4ade80', '#166534', 1 - light);
        roundRect(x, y, size, size, CELL * 0.3);
        ctx.fill();
      }
    }
  }

  function drawEyes(head) {
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const off = CELL * 0.18;
    const eyeR = CELL * 0.09;
    // perpendicular offset so eyes sit on the sides
    const px = dir.y, py = dir.x;
    const fwd = CELL * 0.12;
    const positions = [
      { x: cx + px * off + dir.x * fwd, y: cy + py * off + dir.y * fwd },
      { x: cx - px * off + dir.x * fwd, y: cy - py * off + dir.y * fwd },
    ];
    for (const p of positions) {
      ctx.fillStyle = '#06210f';
      ctx.beginPath();
      ctx.arc(p.x, p.y, eyeR, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function mix(a, b, t) {
    const ca = hex(a), cb = hex(b);
    const r = Math.round(ca[0] + (cb[0] - ca[0]) * t);
    const g = Math.round(ca[1] + (cb[1] - ca[1]) * t);
    const bl = Math.round(ca[2] + (cb[2] - ca[2]) * t);
    return `rgb(${r},${g},${bl})`;
  }
  function hex(h) {
    const v = h.replace('#', '');
    return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)];
  }

  function render() {
    drawGrid();
    if (food) drawFood();
    if (snake) drawSnake();
  }

  // --- Main loop (fixed-timestep logic, smooth render) ---
  function loop(now) {
    rafId = requestAnimationFrame(loop);
    if (state === 'running') {
      const dt = (now - last) / 1000;
      last = now;
      acc += dt;
      const stepTime = 1 / speed;
      // cap steps per frame to avoid spiral of death after a tab stall
      let steps = 0;
      while (acc >= stepTime && steps < 5) {
        acc -= stepTime;
        step();
        steps++;
        if (state !== 'running') break;
      }
    } else {
      last = now;
    }
    render();
  }

  // --- Input ---
  const keyMap = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (state === 'running' || state === 'paused') togglePause();
      else if (state === 'idle' || state === 'over') startGame();
      return;
    }
    if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      startGame();
      return;
    }
    if (e.key === 'Enter' && (state === 'idle' || state === 'over')) {
      startGame();
      return;
    }
    const m = keyMap[e.key];
    if (m) {
      e.preventDefault();
      if (state === 'running') setDir(m[0], m[1]);
      else if (state === 'idle' || state === 'over') { startGame(); setDir(m[0], m[1]); }
    }
  });

  // Touch / swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    if (state === 'idle' || state === 'over') { startGame(); }
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 18) { touchStart = null; return; } // treat as tap
    if (absX > absY) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else startGame();
  });

  pauseBtn.addEventListener('click', () => {
    if (state === 'running' || state === 'paused') togglePause();
    else startGame();
  });

  // First paint
  reset();
  state = 'idle';
  render();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
